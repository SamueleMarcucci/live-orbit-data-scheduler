name: Update Field Guide

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-orbit-field-guide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CatalogMirror
    steps:
      - name: Check out private app pipeline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SamueleMarcucci/live-orbit-app-backup
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CatalogMirror/requirements.txt

      - name: Install dependencies
        run: |
          if python -m pip install -r requirements.txt >"$RUNNER_TEMP/dependencies.log" 2>&1; then
            echo "Dependencies installed."
          else
            status=$?
            echo "::error::Dependency installation failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Run Field Guide unit tests
        run: |
          if python -m unittest discover -s tests -p 'test_field_guide.py' >"$RUNNER_TEMP/field-guide-tests.log" 2>&1; then
            echo "Private Field Guide tests passed."
          else
            status=$?
            echo "::error::Private Field Guide tests failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Build and publish Field Guide feed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_FIELD_GUIDE_BASE_URL: https://api.liveorbitapp.com/insights/field-guide
          FIELD_GUIDE_PREFIX: field-guide/
        run: |
          if python scripts/build_field_guide.py >"$RUNNER_TEMP/field-guide-refresh.log" 2>&1; then
            echo "Field Guide refresh completed."
          else
            status=$?
            echo "::error::Field Guide refresh failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Notify owner on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if python scripts/owner_alerts.py send \
            --title "Live Orbit Field Guide refresh failed" \
            --message "The public scheduler Field Guide workflow did not complete." \
            >"$RUNNER_TEMP/owner-notification.log" 2>&1; then
            echo "Owner notification completed."
          else
            status=$?
            echo "::error::Owner notification failed; private pipeline output suppressed."
            exit "$status"
          fi
