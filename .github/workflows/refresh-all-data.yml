name: Refresh All Live Orbit Data

on:
  workflow_dispatch:
    inputs:
      force_full_catalog:
        description: "Force a full Space-Track GP catalog refresh"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_insights_refresh:
        description: "Ignore cached Space-Track insight inputs"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: live-orbit-full-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out private pipeline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SamueleMarcucci/satellite-catalog-mirror
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          if python -m pip install -r requirements.txt >"$RUNNER_TEMP/dependencies.log" 2>&1; then
            echo "Dependencies installed."
          else
            status=$?
            echo "::error::Dependency installation failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Run unit tests
        run: |
          if python -m unittest discover -s tests >"$RUNNER_TEMP/unit-tests.log" 2>&1; then
            echo "Private pipeline tests passed."
          else
            status=$?
            echo "::error::Private pipeline tests failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Refresh TLE catalog
        env:
          SPACE_TRACK_IDENTITY: ${{ secrets.SPACE_TRACK_IDENTITY }}
          SPACE_TRACK_PASSWORD: ${{ secrets.SPACE_TRACK_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_CATALOG_BASE_URL: ${{ secrets.PUBLIC_CATALOG_BASE_URL }}
          FORCE_FULL: ${{ github.event.inputs.force_full_catalog || 'false' }}
        run: |
          if python scripts/mirror_spacetrack.py --output-dir build/catalog >"$RUNNER_TEMP/catalog-refresh.log" 2>&1; then
            echo "Catalog refresh completed."
          else
            status=$?
            echo "::error::Catalog refresh failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Refresh server snapshot
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_SNAPSHOT_BASE_URL: ${{ secrets.PUBLIC_SNAPSHOT_BASE_URL }}
        run: |
          if python scripts/build_snapshot.py --output-dir build/snapshots >"$RUNNER_TEMP/snapshot-refresh.log" 2>&1; then
            echo "Snapshot refresh completed."
          else
            status=$?
            echo "::error::Snapshot refresh failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Refresh Space-Track insights
        env:
          SPACE_TRACK_IDENTITY: ${{ secrets.SPACE_TRACK_IDENTITY }}
          SPACE_TRACK_PASSWORD: ${{ secrets.SPACE_TRACK_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_CATALOG_BASE_URL: ${{ secrets.PUBLIC_CATALOG_BASE_URL }}
          PUBLIC_INSIGHTS_BASE_URL: ${{ secrets.PUBLIC_INSIGHTS_BASE_URL }}
          INSIGHTS_PREFIX: ${{ vars.INSIGHTS_PREFIX || 'insights/' }}
          INSIGHTS_FETCH_SATNOGS: "true"
          INSIGHTS_FETCH_PREDICTED_APPROACHES: "true"
          DISCOS_API_TOKEN: ${{ secrets.DISCOS_API_TOKEN }}
          ITU_SPACE_EXPLORER_API_TOKEN: ${{ secrets.ITU_SPACE_EXPLORER_API_TOKEN }}
        run: |
          args=()
          if [ "${{ github.event.inputs.force_insights_refresh || 'false' }}" = "true" ]; then
            args+=(--force-refresh)
          fi
          if python -u scripts/build_insights.py --output-dir public/insights --timeout 75 --optional-timeout 25 "${args[@]}" >"$RUNNER_TEMP/insights-refresh.log" 2>&1; then
            echo "Insights refresh completed."
          else
            status=$?
            echo "::error::Insights refresh failed; private pipeline output suppressed."
            exit "$status"
          fi

      - name: Notify owner on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if python scripts/owner_alerts.py send \
            --title "Live Orbit refresh failed" \
            --message "The public scheduler full refresh did not complete." \
            >"$RUNNER_TEMP/owner-notification.log" 2>&1; then
            echo "Owner notification completed."
          else
            status=$?
            echo "::error::Owner notification failed; private pipeline output suppressed."
            exit "$status"
          fi
